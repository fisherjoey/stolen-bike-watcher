[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stolen-bike-watcher"
version = "0.1.0"
description = "Match marketplace bike listings against Bike Index stolen reports"
readme = "README.md"
license = "MIT"
authors = [{ name = "Joey Fisher" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sbw = "sbw.cli:main"

[tool.setuptools]
packages = ["sbw"]
